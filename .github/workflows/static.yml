name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend
        run: |
          for file in api.js core.js auth-validation.js cloud-store.js supabase-config.js script.js social-v2.js; do
            node --check "anime-tracker/$file"
          done
          test -f anime-tracker/index.html
          test -f anime-tracker/social-v2.js

      - name: Run frontend tests (non-blocking)
        continue-on-error: true
        run: node --test anime-tracker/tests/*.test.mjs

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R anime-tracker/. _site/
          rm -rf _site/tests
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
