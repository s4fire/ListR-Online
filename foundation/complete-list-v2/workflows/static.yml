name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend
        run: |
          node --test anime-tracker/tests/*.test.mjs
          for file in api.js core.js auth-validation.js cloud-store.js supabase-config.js anilist-integration-v2.js script.js; do
            node --check "anime-tracker/$file"
          done
          node --check supabase/functions/_shared/anilist-v2.mjs

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R anime-tracker/. _site/
          rm -rf _site/tests
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
